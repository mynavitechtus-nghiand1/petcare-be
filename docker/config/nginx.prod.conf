user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Log to container stdout/stderr so "docker logs" shows nginx logs
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    types_hash_bucket_size 128;
    client_max_body_size 20M;
    server_tokens off;

    # CORS whitelist (map chỉ được khai báo trong http {}; dùng .map để không bị include 2 lần với *.conf)
    include /etc/nginx/conf.d/cors.map;

    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
}
