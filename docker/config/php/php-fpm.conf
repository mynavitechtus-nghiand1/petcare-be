[global]
; Do not use PID file to avoid permission issues
; pid = /var/run/php-fpm.pid

; Master runs as root → can write to stderr; workers output via catch_workers_output
error_log = /proc/self/fd/2

; Log level
log_level = warning

; Emergency restart threshold
emergency_restart_threshold = 10

; Emergency restart interval
emergency_restart_interval = 1m

; Process control timeout
process_control_timeout = 10s

; Process max
process.max = 128

; Send FPM to background
daemonize = no

; Make sure FPM doesn't try to redirect to stderr which causes permission issues
; systemd_interval = 0

[www]
; Pool name
user = www-data
group = www-data

; The address on which to accept FastCGI requests
listen = 0.0.0.0:9000

; Set listen(2) backlog
listen.backlog = 511

; Set permissions for unix socket
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process management
pm = dynamic

; The number of child processes to be created when pm is set to 'static'
pm.max_children = 50

; The number of child processes created on startup
pm.start_servers = 5

; The desired minimum number of idle server processes
pm.min_spare_servers = 5

; The desired maximum number of idle server processes
pm.max_spare_servers = 35

; The number of seconds after which an idle process will be killed
pm.process_idle_timeout = 10s

; The number of requests each child process should execute
pm.max_requests = 500

; The URI to view the FPM status page
pm.status_path = /fpm-status

; The ping URI to call the monitoring page of FPM
ping.path = /fpm-ping

; This directive may be used to customize the response of a ping request
ping.response = pong

; The access log file
access.log = /var/log/php-fpm-access.log

; The access log format
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; The log file for slow requests
slowlog = /var/log/php-fpm-slow.log

; The timeout for serving a single request
request_slowlog_timeout = 10s

; Terminate process after this timeout
request_terminate_timeout = 120s

; Set open file descriptor rlimit
rlimit_files = 1024

; Set max core size rlimit
rlimit_core = 0

; Chdir to this directory at the start
chdir = /var/www/html

; Redirect worker stdout and stderr into main error log
catch_workers_output = yes

; Decorate worker output with prefix and suffix containing information about the child
decorate_workers_output = no

; Clear environment in FPM workers
clear_env = no

; Environment variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP value overrides
php_admin_value[sendmail_path] = /usr/sbin/sendmail -t -i -f www@my.domain.com
php_flag[display_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[max_file_uploads] = 20
