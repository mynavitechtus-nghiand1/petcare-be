services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        - PHP_VERSION=8.4
    tty: true
    container_name: ${COMPOSE_PROJECT_NAME}_app
    hostname: app
    working_dir: /var/www/html
    expose:
      - 9000
      - 9001
    volumes:
      - ./:/var/www/html:cached
      - ./docker/config/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    env_file:
      - .env
    depends_on:
      - database
      - redis
    networks:
      - laravel-network

  nginx:
    image: nginx:1.29
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    tty: true
    expose:
      - "80"
    ports:
      - ${DOCKER_NGINX_PORT:-8080}:80
    volumes:
      - ./:/var/www/html:cached
      - ./docker/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/config/conf.d/:/etc/nginx/conf.d/
      - ./docker/logs:/var/log/nginx/
    depends_on:
      - app
    networks:
      - laravel-network

  database:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME}_db
    platform: linux/x86_64
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=laravel
      - POSTGRES_USER=laravel
      - POSTGRES_PASSWORD=secret
      - PGDATA=/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - ${DOCKER_DATABASE_PORT:-5432}:5432
    networks:
      - laravel-network

  redis:
    image: redis:7.2-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    expose:
      - "6379"
    ports:
      - ${DOCKER_REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    networks:
      - laravel-network

  mailhog:
    image: mailhog/mailhog
    container_name: ${COMPOSE_PROJECT_NAME}_mail
    logging:
      driver: "none"
    ports:
      - ${DOCKER_MAILHOG_SMTP_SERVER_PORT:-1025}:1025
      - ${DOCKER_MAILHOG_WEB_UI_PORT:-8025}:8025
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
